<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Price the salon at its next operating threshold</title>
  <desc id="desc">A small current quote sits beside a larger future-salon worksheet. Notes for another professional, message volume, moved work, transition, and exit costs show why today's subscription is not the full comparison.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#2f2923" flood-opacity=".16"/></filter>
    <style>.sans{font-family:Inter,Arial,sans-serif}.serif{font-family:Georgia,serif}.ink{fill:#2d2823}.body{fill:#575047}.muted{fill:#6a6259}.kicker{font-size:15px;font-weight:700;letter-spacing:.08em}.small{font-size:16px}.mobile{display:none}@media(max-width:430px){.desktop{display:none}.mobile{display:inline}}</style>
  </defs>
  <rect width="1200" height="800" fill="#ece7dd"/>
  <g class="desktop">
    <text x="70" y="64" class="sans muted kicker">SAME CANDIDATE · DIFFERENT OPERATING STATE</text>
    <text x="70" y="112" class="serif ink" font-size="36" font-weight="700">The price changed when the salon did.</text>

    <g transform="rotate(-2.4 215 322)" filter="url(#shadow)">
      <rect x="65" y="173" width="300" height="298" rx="2" fill="#fffdf8" stroke="#b8aea0"/>
      <text x="96" y="216" class="sans muted kicker">CURRENT QUOTE</text>
      <text x="96" y="275" class="serif ink" font-size="31" font-weight="700">Today's salon</text>
      <line x1="96" y1="302" x2="330" y2="302" stroke="#d6cec1"/>
      <text x="96" y="347" class="sans body" font-size="18">Current team</text>
      <text x="96" y="383" class="sans body" font-size="18">Current location</text>
      <text x="96" y="419" class="sans body" font-size="18">Current usage</text>
      <rect x="89" y="444" width="251" height="53" fill="#f2ede4"/>
      <text x="214" y="478" text-anchor="middle" class="sans ink" font-size="18" font-weight="700">SUBSCRIPTION ONLY</text>
    </g>

    <g transform="rotate(.8 745 390)" filter="url(#shadow)">
      <rect x="420" y="145" width="650" height="473" rx="2" fill="#fffaf2" stroke="#b4a99b"/>
      <text x="460" y="190" class="sans muted kicker">NEXT-THRESHOLD WORKSHEET</text>
      <text x="460" y="246" class="serif ink" font-size="34" font-weight="700">Price the salon you are becoming</text>
      <text x="460" y="283" class="sans body" font-size="18">7 professionals · 500 appointments · 1 location</text>
      <line x1="458" y1="312" x2="1028" y2="312" stroke="#c9bfb1"/>
      <text x="462" y="354" class="sans kicker" fill="#655e56" font-size="15">WHAT CHANGES</text>
      <text x="462" y="399" class="sans ink" font-size="21" font-weight="700">Team, plan, location</text>
      <text x="764" y="399" class="sans body" font-size="18">quote again</text>
      <line x1="460" y1="418" x2="1028" y2="418" stroke="#ddd5c9"/>
      <text x="462" y="458" class="sans ink" font-size="21" font-weight="700">Messages, payments, add-ons</text>
      <text x="886" y="458" class="sans body" font-size="18">use real volume</text>
      <line x1="460" y1="477" x2="1028" y2="477" stroke="#ddd5c9"/>
      <text x="462" y="517" class="sans ink" font-size="21" font-weight="700">Work moved to the team</text>
      <text x="828" y="517" class="sans body" font-size="18">measure, do not assume</text>
      <line x1="460" y1="536" x2="1028" y2="536" stroke="#ddd5c9"/>
      <text x="462" y="576" class="sans ink" font-size="21" font-weight="700">Implementation and exit</text>
      <text x="820" y="576" class="sans body" font-size="18">keep visible</text>
      <path d="M660 602 C780 608 896 604 1025 611" fill="none" stroke="#a54a3e" stroke-width="3"/>
    </g>

    <g transform="rotate(-4 235 613)" filter="url(#shadow)">
      <rect x="40" y="536" width="390" height="154" rx="2" fill="#f4dfcf" stroke="#b88a78"/>
      <text x="71" y="584" class="sans" fill="#875647" font-size="14" font-weight="700" letter-spacing=".07em">COUNTERFACTUAL</text>
      <text x="71" y="624" class="serif ink" font-size="22" font-weight="700">Could the current workflow</text>
      <text x="71" y="653" class="serif ink" font-size="22" font-weight="700">do this?</text>
    </g>

    <g transform="rotate(2.1 938 687)" filter="url(#shadow)">
      <rect x="752" y="626" width="372" height="122" rx="2" fill="#f9f6ef" stroke="#b7ad9f"/>
      <text x="783" y="667" class="sans kicker" fill="#655e56">DECISION RULE</text>
      <text x="783" y="706" class="serif ink" font-size="21" font-weight="700">Count the difference—</text>
      <text x="783" y="734" class="serif ink" font-size="21" font-weight="700">not the promise.</text>
    </g>

    <text x="70" y="782" class="serif body" font-size="20" font-style="italic">The current invoice is evidence. It is not yet the economic decision.</text>
  </g>

  <g class="mobile">
    <text x="60" y="56" class="sans muted" font-size="28" font-weight="700" letter-spacing=".07em">SAME SOFTWARE · DIFFERENT SALON</text>
    <text x="60" y="108" class="serif ink" font-size="43" font-weight="700">The price changed when the salon did.</text>
    <g transform="rotate(-1.2 600 235)" filter="url(#shadow)">
      <rect x="60" y="135" width="1080" height="202" rx="3" fill="#fffdf8" stroke="#b8aea0"/>
      <text x="105" y="187" class="sans muted" font-size="30" font-weight="700">CURRENT QUOTE</text>
      <text x="105" y="249" class="serif ink" font-size="40" font-weight="700">Today's team · location · usage</text>
      <rect x="850" y="184" width="236" height="82" fill="#f2ede4"/>
      <text x="968" y="235" text-anchor="middle" class="sans ink" font-size="26" font-weight="700">SUBSCRIPTION</text>
    </g>
    <g transform="rotate(.5 600 510)" filter="url(#shadow)">
      <rect x="60" y="362" width="1080" height="306" rx="3" fill="#fffaf2" stroke="#b4a99b"/>
      <text x="105" y="414" class="sans" fill="#655e56" font-size="30" font-weight="700">NEXT THRESHOLD · SAME CANDIDATE</text>
      <text x="105" y="473" class="serif ink" font-size="40" font-weight="700">Price the salon you are becoming</text>
      <line x1="105" y1="500" x2="1090" y2="500" stroke="#c9bfb1"/>
      <text x="105" y="548" class="sans ink" font-size="27" font-weight="700">Team + usage + add-ons</text>
      <text x="105" y="594" class="sans ink" font-size="27" font-weight="700">Moved work + transition + exit</text>
      <path d="M105 625 C420 638 770 627 1090 636" fill="none" stroke="#a54a3e" stroke-width="4"/>
    </g>
    <g transform="rotate(-1.8 600 725)" filter="url(#shadow)">
      <rect x="205" y="691" width="790" height="72" rx="3" fill="#f4dfcf" stroke="#b88a78"/>
      <text x="600" y="737" text-anchor="middle" class="serif ink" font-size="28" font-weight="700">Could the current workflow do the same?</text>
    </g>
    <text x="600" y="794" text-anchor="middle" class="sans body" font-size="21">Count the difference—not the promise.</text>
  </g>
</svg>
