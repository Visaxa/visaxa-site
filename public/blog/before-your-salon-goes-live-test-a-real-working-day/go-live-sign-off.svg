<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">Go-live sign-off follows observed salon scenarios</title>
  <desc id="desc">An owner acceptance sheet shows pass, conditional, and not-tested results. The decision is blocked because an untested material scenario cannot become a pass.</desc>
  <style>.mobile{display:none}@media(max-width:500px){.desktop{display:none}.mobile{display:inline}}</style>
  <rect width="760" height="430" fill="#f3eee5"/>
  <g class="desktop">
    <text x="38" y="43" fill="#965244" font-family="Arial,sans-serif" font-size="13" letter-spacing="2">GO-LIVE ACCEPTANCE</text><text x="38" y="83" fill="#201f1c" font-family="Georgia,serif" font-size="30">The signature follows the evidence.</text>
    <g transform="translate(49 116) rotate(-0.8)"><rect width="662" height="247" rx="3" fill="#fffdfa" stroke="#bfb2a3"/><text x="25" y="31" fill="#65726d" font-family="Arial,sans-serif" font-size="11" letter-spacing="1.4">OWNER'S ACCEPTANCE SHEET · 27 AUG 2026</text><line x1="25" y1="47" x2="637" y2="47" stroke="#d7cfc4"/><g font-family="Arial,sans-serif" font-size="14" fill="#37332e"><text x="27" y="77">Front desk · ordinary booking</text><text x="614" y="77" text-anchor="end" fill="#52675e" font-size="12">PASS</text><line x1="25" y1="91" x2="637" y2="91" stroke="#ebe5dd"/><text x="27" y="121">Client · online booking journey</text><text x="614" y="121" text-anchor="end" fill="#52675e" font-size="12">PASS</text><line x1="25" y1="135" x2="637" y2="135" stroke="#ebe5dd"/><text x="27" y="165">Manager · late cancellation</text><text x="614" y="165" text-anchor="end" fill="#8b672f" font-size="12">CONDITIONAL · OWNER + DATE</text><line x1="25" y1="179" x2="637" y2="179" stroke="#ebe5dd"/><rect x="18" y="188" width="626" height="39" fill="#f1dfda"/><text x="27" y="213" fill="#7d4036">Reception · refund and closeout</text><text x="614" y="213" text-anchor="end" fill="#965244" font-size="12">NOT TESTED</text></g></g>
    <text x="54" y="391" fill="#201f1c" font-family="Georgia,serif" font-size="18">Decision</text><line x1="127" y1="386" x2="407" y2="386" stroke="#965244" stroke-width="1.5"/><text x="425" y="391" fill="#965244" font-family="Arial,sans-serif" font-size="13" letter-spacing="1">BLOCKED — UNKNOWN CANNOT PASS</text>
  </g>
  <g class="mobile">
    <text x="38" y="48" fill="#965244" font-family="Arial,sans-serif" font-size="22" letter-spacing="2">GO-LIVE SIGN-OFF</text><text x="38" y="91" fill="#201f1c" font-family="Georgia,serif" font-size="32">Evidence first.</text>
    <g transform="translate(38 126)"><rect width="684" height="189" rx="3" fill="#fffdfa" stroke="#bfb2a3"/><g font-family="Arial,sans-serif" font-size="22" fill="#37332e"><text x="24" y="45">Front desk + client journey</text><text x="652" y="45" text-anchor="end" fill="#52675e">PASS</text><line x1="24" y1="65" x2="660" y2="65" stroke="#ebe5dd"/><text x="24" y="105">Late cancellation</text><text x="652" y="105" text-anchor="end" fill="#8b672f">CONDITIONAL</text><rect x="12" y="126" width="660" height="48" fill="#f1dfda"/><text x="24" y="157" fill="#7d4036">Refund + closeout</text><text x="652" y="157" text-anchor="end" fill="#965244">NOT TESTED</text></g></g>
    <text x="38" y="361" fill="#201f1c" font-family="Georgia,serif" font-size="28">No observed result. No signature.</text><text x="38" y="397" fill="#965244" font-family="Arial,sans-serif" font-size="22" letter-spacing="1">UNKNOWN CANNOT PASS</text>
  </g>
</svg>
