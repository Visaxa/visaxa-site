<g transform="translate(230 16) rotate(3 53 26)" filter="url(#s)"><rect width="106" height="52" fill="#e8e1d3" class="pp"/><text x="12" y="16" class="lb" font-size="8">ACCESS</text><text x="12" y="36" class="sf" font-size="14" fill="#34302b">revoke last</text></g>
