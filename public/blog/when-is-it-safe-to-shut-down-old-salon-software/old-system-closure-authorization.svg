<g transform="translate(18 107)"><rect width="11" height="11" fill="#f8f4ea" stroke="#7b7167"/><path d="M2 6l4 3 5-7" fill="none" stroke="#8c4639" stroke-width="1.5"/><text x="20" y="9" class="lb" font-size="8">FINAL TIE-OUT</text><text x="20" y="24" class="sf" font-size="11">closing and opening agree</text></g>
<g transform="translate(18 144)"><rect width="11" height="11" fill="#f8f4ea" stroke="#7b7167"/><path d="M2 6l4 3 5-7" fill="none" stroke="#8c4639" stroke-width="1.5"/><text x="20" y="9" class="lb" font-size="8">OPEN ITEMS</text><text x="20" y="24" class="sf" font-size="11">owner and evidence recorded</text></g>
<g transform="translate(160 169) rotate(-3 50 10)"><rect width="100" height="20" fill="none" stroke="#9d4d40" stroke-width="1.5"/><text x="50" y="14" text-anchor="middle" class="sn" font-size="9" font-weight="600" fill="#9d4d40">READY TO CLOSE</text></g></g>
<text x="175" y="283" text-anchor="middle" class="sf" font-size="17" fill="#3b342e">The date is not the gate.</text><text x="175" y="301" text-anchor="middle" class="sn" font-size="9" font-weight="500" fill="#6b625a">Nothing material exists only in the old system.</text>
</g>
