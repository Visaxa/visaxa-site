<svg xmlns="http://www.w3.org/2000/svg" width="560" height="500" viewBox="0 0 560 500" role="img" aria-labelledby="title desc">
<title id="title">Old system closure authorization</title><desc id="desc">A paper closeout packet shows that a cancellation date is not enough. Closure requires a retrievable archive, final tie-out, owned open obligations, and an expired rollback window.</desc>
<defs><filter id="s" x="-20%" y="-20%" width="150%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#342d25" flood-opacity=".16"/></filter><style>.sn{font-family:Inter,Arial,sans-serif}.sf{font-family:Georgia,serif}.lb{font:600 10px Inter,Arial,sans-serif;letter-spacing:.05em;fill:#746b63}.bd{font:14px Georgia,serif;fill:#302c27}.fn{font:11px Inter,Arial,sans-serif;fill:#746b63}.pp{stroke:#c7bfb2}.rl{stroke:#b9b0a5}.mobile{display:none}@media(max-width:430px){.desktop{display:none}.mobile{display:inline}}</style></defs>
<rect width="560" height="500" rx="12" fill="#ede7db"/>
<g fill="#cfc5b6" opacity=".46"><circle cx="16" cy="72" r="1"/><circle cx="83" cy="25" r="1"/><circle cx="166" cy="119" r="1"/><circle cx="249" cy="166" r="1"/><circle cx="332" cy="213" r="1"/><circle cx="415" cy="260" r="1"/><circle cx="498" cy="307" r="1"/><circle cx="28" cy="354" r="1"/><circle cx="111" cy="401" r="1"/><circle cx="194" cy="448" r="1"/></g>
<g class="desktop">
<g transform="translate(34 42) rotate(-4 71 51)" filter="url(#s)"><rect width="142" height="102" fill="#f2e4cf" class="pp"/><text x="17" y="25" class="lb" fill="#86584a">CANCEL</text><text x="17" y="53" class="sf" font-size="25" fill="#3a332d">FRIDAY</text><path d="M15 65L123 54" stroke="#a45143" stroke-width="2"/><text x="17" y="87" class="sn" font-size="12" font-weight="500" fill="#86584a">date ≠ proof</text></g>
<g transform="translate(414 42) rotate(3 70 54)" filter="url(#s)"><rect width="140" height="108" fill="#e8e1d3" class="pp"/><text x="42" y="24" class="lb">ACCESS</text><path d="M42 34H124" class="rl"/><text x="42" y="61" class="sf" font-size="19" fill="#34302b">revoke last</text><text x="42" y="83" class="fn">after capture</text></g>
<g transform="translate(124 92) rotate(-1 163 175)" filter="url(#s)"><rect width="326" height="350" fill="#fefcf7" class="pp"/><text x="25" y="34" class="lb">OLD SYSTEM</text><text x="25" y="68" class="sf" font-size="28" fill="#302b27">Closure authorization</text><path d="M25 81H300" class="rl"/>
<g transform="translate(26 101)"><rect width="15" height="15" rx="1" fill="#f8f4ea" stroke="#7b7167"/><path d="M3 8l5 4 6-9" fill="none" stroke="#8c4639" stroke-width="2"/><text x="26" y="11" class="lb">ARCHIVE</text><text x="26" y="33" class="bd">retrieved without the old login</text></g>
<g transform="translate(26 160)"><rect width="15" height="15" rx="1" fill="#f8f4ea" stroke="#7b7167"/><path d="M3 8l5 4 6-9" fill="none" stroke="#8c4639" stroke-width="2"/><text x="26" y="11" class="lb">FINAL TIE-OUT</text><text x="26" y="33" class="bd">closing and opening references agree</text></g>
<g transform="translate(26 219)"><rect width="15" height="15" rx="1" fill="#f8f4ea" stroke="#7b7167"/><path d="M3 8l5 4 6-9" fill="none" stroke="#8c4639" stroke-width="2"/><text x="26" y="11" class="lb">OPEN OBLIGATIONS</text><text x="26" y="33" class="bd">owner and evidence location recorded</text></g>
<g transform="translate(26 278)"><rect width="15" height="15" rx="1" fill="#f8f4ea" stroke="#7b7167"/><path d="M3 8l5 4 6-9" fill="none" stroke="#8c4639" stroke-width="2"/><text x="26" y="11" class="lb">ROLLBACK</text><text x="26" y="33" class="bd">last reversible point has passed</text></g>
<g transform="translate(158 315) rotate(-3 66 14)"><rect width="132" height="27" fill="none" stroke="#9d4d40" stroke-width="2"/><text x="66" y="18" text-anchor="middle" class="sn" font-size="12" font-weight="600" fill="#9d4d40">READY TO CLOSE</text></g></g>
<g transform="translate(4 300) rotate(-3 64 72)" filter="url(#s)"><rect width="128" height="144" fill="#f7f0e3" class="pp"/><text x="12" y="25" class="lb">RETRIEVAL TEST</text><text x="12" y="54" class="sf" font-size="18" fill="#302c27"><tspan x="12">Can we find it</tspan><tspan x="12" dy="23">without signing in?</tspan></text><path d="M12 92H116" stroke="#cfc2b2"/><text x="12" y="115" class="fn">file · index · meaning</text></g>
<g transform="translate(430 300) rotate(2 63 75)" filter="url(#s)"><rect width="126" height="150" fill="#f4efe5" class="pp"/><text x="14" y="26" class="lb">FINAL TIE-OUT</text><text x="14" y="57" class="sn" font-size="14" font-weight="500" fill="#302c27">OLD  4,218</text><text x="14" y="80" class="sn" font-size="14" font-weight="500" fill="#302c27">NEW 4,218</text><path d="M14 91H112" class="rl"/><text x="14" y="118" class="sf" font-size="17" fill="#7b493f"><tspan x="14">boundary</tspan><tspan x="14" dy="20">recorded</tspan></text></g>
<text x="30" y="466" class="sf" font-size="20" fill="#3b342e">The date is not the gate.</text><text x="30" y="490" class="sn" font-size="14" font-weight="500" fill="#6b625a">Nothing material may exist only in the old system.</text>
</g>
<g class="mobile" transform="scale(1.6)">
