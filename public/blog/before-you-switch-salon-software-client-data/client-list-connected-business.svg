<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 980" role="img" aria-labelledby="title desc">
  <title id="title">Client list versus connected business records</title>
  <desc id="desc">A client identity is connected to appointments, staff relationships, notes and files, packages and balances, payments, and communication consent.</desc>
  <rect width="760" height="980" fill="#fafaf9"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="50" y="68" fill="#1c1917" font-size="30" font-weight="700">The client list is the centre, not the whole</text>
    <text x="50" y="105" fill="#57534e" font-size="20">Continuity depends on the records connected to each identity.</text>

    <g fill="#fafaf9" stroke="#1c1917" stroke-width="3">
      <rect x="130" y="155" width="500" height="108" rx="10"/>
      <rect x="130" y="330" width="500" height="82" rx="10"/>
      <rect x="130" y="445" width="500" height="82" rx="10"/>
      <rect x="130" y="560" width="500" height="82" rx="10"/>
      <rect x="130" y="675" width="500" height="82" rx="10"/>
      <rect x="130" y="790" width="500" height="82" rx="10"/>
      <rect x="130" y="905" width="500" height="62" rx="10"/>
    </g>

    <g fill="none" stroke="#78716c" stroke-width="3">
      <path d="M380 263 V330"/>
      <path d="M380 412 V445"/>
      <path d="M380 527 V560"/>
      <path d="M380 642 V675"/>
      <path d="M380 757 V790"/>
      <path d="M380 872 V905"/>
    </g>

    <g fill="#78716c">
      <path d="M380 330 l-10 -16 h20z"/>
      <path d="M380 445 l-10 -16 h20z"/>
      <path d="M380 560 l-10 -16 h20z"/>
      <path d="M380 675 l-10 -16 h20z"/>
      <path d="M380 790 l-10 -16 h20z"/>
      <path d="M380 905 l-10 -16 h20z"/>
    </g>

    <g fill="#1c1917" text-anchor="middle">
      <text x="380" y="207" font-size="29" font-weight="700">Client identity</text>
      <text x="380" y="239" font-size="18" fill="#57534e">the contact list</text>
      <text x="380" y="381" font-size="25" font-weight="600">Appointments</text>
      <text x="380" y="496" font-size="25" font-weight="600">Staff relationships</text>
      <text x="380" y="611" font-size="25" font-weight="600">Notes, forms and photos</text>
      <text x="380" y="726" font-size="25" font-weight="600">Packages and balances</text>
      <text x="380" y="841" font-size="25" font-weight="600">Payments</text>
      <text x="380" y="945" font-size="25" font-weight="600">Communication consent</text>
    </g>
  </g>
</svg>
