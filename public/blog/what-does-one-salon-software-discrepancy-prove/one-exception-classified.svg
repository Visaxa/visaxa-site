<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" role="img" aria-labelledby="title desc">
  <title id="title">One salon software exception classified from physical evidence</title>
  <desc id="desc">A completed appointment still marked booked is compared with a staff note, a documented manual-status rule, and a salon requirement. A physical stamp classifies the result as a fit boundary, not a proven defect.</desc>
  <defs>
    <filter id="paper" x="-25%" y="-25%" width="160%" height="170%"><feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#514a42" flood-opacity=".2"/></filter>
    <filter id="lift" x="-25%" y="-25%" width="160%" height="175%"><feDropShadow dx="3" dy="8" stdDeviation="6" flood-color="#514a42" flood-opacity=".25"/></filter>
    <pattern id="grain" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="3" cy="5" r=".55" fill="#6f675d" opacity=".08"/><circle cx="14" cy="12" r=".45" fill="#6f675d" opacity=".06"/></pattern>
  </defs>
  <rect width="560" height="500" fill="#e8e1d5"/><rect width="560" height="500" fill="url(#grain)"/>

  <g transform="translate(24 27) rotate(-2.1 135 99)" filter="url(#lift)">
    <path d="M0 0H270V194L257 207H0Z" fill="#f8e9e1" stroke="#b98072" stroke-width="1.5"/>
    <path d="M257 194H270L257 207Z" fill="#dec0b7"/>
    <rect width="270" height="37" fill="#754438"/>
    <text x="17" y="25" fill="#fffaf3" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.1">ONE VERIFIED EXCEPTION</text>
    <g fill="#754438" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing=".7"><text x="17" y="70">EVENT</text><text x="17" y="104">OBSERVED</text><text x="17" y="143">EXPECTED</text></g>
    <g fill="#292621" font-family="Arial,sans-serif" font-size="17"><text x="109" y="70">Service complete</text><text x="109" y="104">Still BOOKED</text><text x="109" y="143">Complete</text></g>
    <line x1="96" y1="48" x2="96" y2="159" stroke="#cfaaa0"/>
    <ellipse cx="164" cy="99" rx="65" ry="22" fill="none" stroke="#a64d3e" stroke-width="2.3" transform="rotate(-4 164 99)"/>
    <text x="17" y="183" fill="#755f58" font-family="Georgia,serif" font-size="15" font-style="italic">Records already reconciled</text>
  </g>

  <g transform="translate(320 24) rotate(2.7 102 83)" filter="url(#paper)">
    <path d="M0 0H204V166H0Z" fill="#fffdf7" stroke="#aaa095" stroke-width="1.4"/>
    <path d="M16 0v166M0 35h204" stroke="#d5cdc2"/>
    <text x="31" y="24" fill="#5e574f" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.1">DOCUMENTED RULE</text>
    <text x="31" y="68" fill="#2b2824" font-family="Georgia,serif" font-size="19" font-weight="700">Checkout does not</text>
    <text x="31" y="98" fill="#2b2824" font-family="Georgia,serif" font-size="19">change the status.</text>
    <path d="M31 118C72 113 125 123 173 116" fill="none" stroke="#9d4f40" stroke-width="2" stroke-linecap="round"/>
    <text x="31" y="143" fill="#6b6259" font-family="Arial,sans-serif" font-size="14">Scope and date checked</text>
  </g>

  <g transform="translate(34 276) rotate(1.8 116 83)" filter="url(#paper)">
    <path d="M0 0H232V166H0Z" fill="#f1eee6" stroke="#9f978c" stroke-width="1.4"/>
    <path d="M0 12h232M0 154h232" stroke="#ccc4b8"/>
    <text x="17" y="39" fill="#5d564e" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">SALON REQUIREMENT</text>
    <line x1="17" y1="53" x2="214" y2="53" stroke="#b1a89d"/>
    <text x="17" y="85" fill="#2c2925" font-family="Georgia,serif" font-size="20" font-weight="700">One closeout action</text>
    <text x="17" y="115" fill="#2c2925" font-family="Georgia,serif" font-size="18">must finish the visit.</text>
    <text x="17" y="142" fill="#71685f" font-family="Arial,sans-serif" font-size="14">Required operating model</text>
  </g>

  <g transform="translate(278 230) rotate(-1.4 130 112)" filter="url(#lift)">
    <path d="M0 0H260V224H0Z" fill="#fffdf7" stroke="#9e958a" stroke-width="1.5"/>
    <rect x="18" y="18" width="224" height="32" fill="#34312d"/>
    <text x="130" y="39" text-anchor="middle" fill="#fffdf7" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">CLASSIFICATION</text>
    <g fill="#625a52" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing=".7"><text x="20" y="80">BEHAVIOR</text><text x="20" y="109">FIT</text><text x="20" y="138">DEFECT</text></g>
    <g fill="#2b2824" font-family="Arial,sans-serif" font-size="15"><text x="116" y="80">Documented</text><text x="116" y="109">Does not fit</text><text x="116" y="138">Not proven</text></g>
    <line x1="101" y1="62" x2="101" y2="147" stroke="#d6cec2"/>
    <g transform="rotate(4.2 132 181)">
      <rect x="27" y="158" width="210" height="48" rx="2" fill="none" stroke="#9d4f40" stroke-width="2.7"/>
      <rect x="31" y="162" width="202" height="40" rx="1" fill="none" stroke="#9d4f40" stroke-width=".8" opacity=".65"/>
      <text x="132" y="181" text-anchor="middle" fill="#914236" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="1.3">FIT BOUNDARY</text>
      <text x="132" y="196" text-anchor="middle" fill="#914236" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1">NOT DEFECT PROOF</text>
    </g>
  </g>

  <text x="28" y="481" fill="#524b44" font-family="Georgia,serif" font-size="17" font-style="italic">The evidence names the boundary without inventing the cause.</text>
</svg>
