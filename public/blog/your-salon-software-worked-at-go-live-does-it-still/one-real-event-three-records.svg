<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 570" role="img" aria-labelledby="title desc">
  <title id="title">One real salon event explained across several records</title>
  <desc id="desc">A completed salon appointment is traced through a booking card, payment receipt, sales report, and exception note. Different amounts are explained by an earlier deposit, while an unchanged appointment status remains unresolved.</desc>
  <defs>
    <filter id="paperShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#6f655a" flood-opacity=".18"/>
    </filter>
  </defs>

  <rect width="640" height="570" fill="#eee8de"/>
  <path d="M0 101H640M0 455H640" stroke="#d8cfc2" stroke-width="1"/>

  <text x="30" y="43" fill="#25231f" font-family="Georgia,serif" font-size="28" font-weight="700">One event. Several honest records.</text>
  <text x="30" y="75" fill="#665f56" font-family="Arial,sans-serif" font-size="18">Different values need an explanation—not forced agreement.</text>

  <g transform="translate(38 123) rotate(-1.4 128 136)" filter="url(#paperShadow)">
    <rect width="256" height="272" rx="3" fill="#fffdf8" stroke="#bfb5a8" stroke-width="1.5"/>
    <circle cx="128" cy="11" r="4" fill="#c8bdb0"/>
    <text x="20" y="39" fill="#8e493c" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.2">REAL EVENT · FRIDAY</text>
    <text x="20" y="76" fill="#25231f" font-family="Georgia,serif" font-size="25" font-weight="700">Colour service</text>
    <text x="20" y="106" fill="#25231f" font-family="Georgia,serif" font-size="23">completed at 3 PM</text>
    <line x1="20" y1="128" x2="236" y2="128" stroke="#d8d0c5"/>
    <text x="20" y="158" fill="#665f56" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing=".7">SERVICE PRICE</text>
    <text x="172" y="160" fill="#25231f" font-family="Georgia,serif" font-size="24" font-weight="700">$120</text>
    <text x="20" y="197" fill="#665f56" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing=".7">PAID EARLIER</text>
    <text x="178" y="199" fill="#25231f" font-family="Georgia,serif" font-size="22">$30</text>
    <text x="20" y="235" fill="#665f56" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing=".7">PAID TODAY</text>
    <text x="178" y="237" fill="#25231f" font-family="Georgia,serif" font-size="22">$90</text>
  </g>

  <g transform="translate(321 118) rotate(1.2 132 83)" filter="url(#paperShadow)">
    <rect width="264" height="166" rx="3" fill="#fdf9f0" stroke="#bfb5a8" stroke-width="1.5"/>
    <text x="20" y="33" fill="#665f56" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="1">PAYMENT RECEIPT</text>
    <text x="20" y="70" fill="#25231f" font-family="Georgia,serif" font-size="24" font-weight="700">Collected today · $90</text>
    <text x="20" y="102" fill="#665f56" font-family="Arial,sans-serif" font-size="17">Earlier deposit · $30</text>
    <rect x="20" y="122" width="110" height="25" rx="12.5" fill="#e7eee7"/>
    <text x="34" y="140" fill="#3e674d" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing=".7">EXPLAINED</text>
  </g>

  <g transform="translate(340 303) rotate(-.8 122 75)" filter="url(#paperShadow)">
    <rect width="244" height="150" rx="3" fill="#fffefb" stroke="#bfb5a8" stroke-width="1.5"/>
    <text x="18" y="31" fill="#665f56" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="1">SALES REPORT</text>
    <text x="18" y="69" fill="#25231f" font-family="Georgia,serif" font-size="24" font-weight="700">Service sale · $120</text>
    <path d="M20 91C70 99 145 91 216 96" fill="none" stroke="#a75745" stroke-width="2" stroke-linecap="round"/>
    <text x="18" y="124" fill="#8e493c" font-family="Georgia,serif" font-size="17" font-style="italic">Same event. Different question.</text>
  </g>

  <g transform="translate(55 419) rotate(1.6 130 55)" filter="url(#paperShadow)">
    <rect width="260" height="110" rx="3" fill="#f4e5dc" stroke="#c99d8f" stroke-width="1.5"/>
    <text x="18" y="29" fill="#8e493c" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1">APPOINTMENT RECORD</text>
    <text x="18" y="60" fill="#25231f" font-family="Georgia,serif" font-size="22" font-weight="700">Still marked “booked”</text>
    <text x="18" y="88" fill="#8e493c" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing=".7">UNRESOLVED EXCEPTION</text>
  </g>

  <g transform="translate(367 487)">
    <line x1="0" y1="0" x2="218" y2="0" stroke="#9e9285"/>
    <text x="0" y="27" fill="#25231f" font-family="Georgia,serif" font-size="18" font-style="italic">Different can be correct.</text>
    <text x="0" y="51" fill="#25231f" font-family="Georgia,serif" font-size="18" font-style="italic">Unexplained needs investigation.</text>
  </g>
</svg>
