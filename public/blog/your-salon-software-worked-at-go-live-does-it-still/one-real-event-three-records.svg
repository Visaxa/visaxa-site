<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" role="img" aria-labelledby="title desc">
  <title id="title">One salon visit recorded in several different ways</title>
  <desc id="desc">Four overlapping working papers show one 120 dollar salon service. A receipt records 90 dollars paid today and 30 dollars paid earlier, a sales report records 120 dollars, and both are explained. An appointment slip still marked booked is stamped unresolved.</desc>
  <defs>
    <filter id="low" x="-20%" y="-20%" width="150%" height="160%"><feDropShadow dx="1" dy="3" stdDeviation="3" flood-color="#514a42" flood-opacity=".18"/></filter>
    <filter id="high" x="-25%" y="-25%" width="160%" height="170%"><feDropShadow dx="2" dy="7" stdDeviation="5" flood-color="#514a42" flood-opacity=".24"/></filter>
    <pattern id="grain" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="3" cy="5" r=".55" fill="#6f675d" opacity=".08"/><circle cx="14" cy="12" r=".45" fill="#6f675d" opacity=".06"/></pattern>
  </defs>
  <rect width="560" height="500" fill="#e9e3d9"/><rect width="560" height="500" fill="url(#grain)"/>

  <g transform="translate(27 32) rotate(-2 132 91)" filter="url(#low)">
    <path d="M0 0H264V168L251 182H0Z" fill="#fffdf7" stroke="#aaa095" stroke-width="1.4"/><path d="M251 168H264L251 182Z" fill="#d8cfc2"/>
    <rect width="264" height="35" fill="#35322e"/><text x="18" y="24" fill="#fffdf7" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="1.3">REAL EVENT · FRI</text>
    <text x="18" y="68" fill="#292621" font-family="Georgia,serif" font-size="25" font-weight="700">Colour service</text>
    <g fill="#686057" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing=".7"><text x="18" y="101">TIME</text><text x="18" y="132">PRICE</text><text x="18" y="163">STATE</text></g>
    <g fill="#292621" font-family="Arial,sans-serif" font-size="19"><text x="105" y="101">3:00 PM</text><text x="105" y="132">$120</text><text x="105" y="163">Completed</text></g>
    <line x1="96" y1="78" x2="96" y2="168" stroke="#d2c9bd"/>
  </g>

  <g transform="translate(312 19) rotate(1.5 91 131)" filter="url(#high)">
    <path d="M0 0H182V250L171 260L160 250L149 260L138 250L127 260L116 250L105 260L94 250L83 260L72 250L61 260L50 250L39 260L28 250L17 260L0 250Z" fill="#faf9f3" stroke="#b8afa4" stroke-width="1.3"/>
    <text x="91" y="35" text-anchor="middle" fill="#2d2a26" font-family="Courier New,monospace" font-size="20" font-weight="700">RECEIPT</text><path d="M19 49H163" stroke="#777067" stroke-dasharray="4 4"/>
    <g fill="#393531" font-family="Courier New,monospace" font-size="17"><text x="18" y="81">PAID TODAY</text><text x="164" y="81" text-anchor="end" font-weight="700">$90</text><text x="18" y="116">DEPOSIT</text><text x="164" y="116" text-anchor="end">$30</text><text x="18" y="143">paid earlier</text></g>
    <path d="M19 164H163" stroke="#777067" stroke-dasharray="4 4"/>
    <g transform="rotate(-2.2 91 205.5)"><rect x="24" y="186" width="134" height="39" rx="2" fill="none" stroke="#4f765c" stroke-width="2"/><text x="91" y="212" text-anchor="middle" fill="#3e684c" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="1">EXPLAINED</text></g>
  </g>

  <g transform="translate(285 269) rotate(-1.1 132 93)" filter="url(#low)">
    <path d="M0 0H264V186H0Z" fill="#f3f0e8" stroke="#9e968c" stroke-width="1.4"/><path d="M0 10H264M0 176H264" stroke="#c9c1b6"/>
    <text x="18" y="39" fill="#625b53" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="1.4">DAILY SALES · FRIDAY</text><line x1="18" y1="54" x2="246" y2="54" stroke="#aaa196"/>
    <text x="18" y="90" fill="#2a2723" font-family="Georgia,serif" font-size="22">Colour service</text><text x="244" y="90" text-anchor="end" fill="#2a2723" font-family="Georgia,serif" font-size="24" font-weight="700">$120</text><text x="18" y="121" fill="#696158" font-family="Arial,sans-serif" font-size="17">Sale value</text>
    <path d="M18 141C78 135 151 148 244 139" fill="none" stroke="#9d4f40" stroke-width="2.2" stroke-linecap="round"/>
    <g transform="rotate(2.4 84.5 162.5)"><rect x="18" y="148" width="133" height="29" rx="1" fill="none" stroke="#4f765c" stroke-width="2"/><text x="84.5" y="169" text-anchor="middle" fill="#3e684c" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="1">EXPLAINED</text></g>
  </g>

  <g transform="translate(33 266) rotate(1.8 133 92)" filter="url(#high)">
    <path d="M0 0H266L260 200H0Z" fill="#f2dfd6" stroke="#b98273" stroke-width="1.5"/><path d="M0 40H266M92 40V200" stroke="#c69a8e"/>
    <text x="17" y="27" fill="#754438" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="1.2">APPOINTMENT SLIP</text>
    <g fill="#754438" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing=".6"><text x="16" y="73">TIME</text><text x="16" y="109">SERVICE</text><text x="16" y="145">STATUS</text></g>
    <g fill="#292621" font-family="Arial,sans-serif" font-size="18"><text x="108" y="73">3:00 PM</text><text x="108" y="109">Colour</text><text x="108" y="145" font-size="24" font-weight="700">BOOKED</text></g>
    <ellipse cx="159" cy="138" rx="62" ry="24" fill="none" stroke="#a64d3e" stroke-width="2.5" transform="rotate(-4 159 138)"/><path d="M215 119l21-15M221 126l24-8" stroke="#a64d3e" stroke-width="2" stroke-linecap="round"/>
    <g transform="rotate(-3.4 125 171.5)"><rect x="14" y="154" width="222" height="35" rx="1" fill="none" stroke="#a64d3e" stroke-width="2.4"/><rect x="18" y="158" width="214" height="27" rx="1" fill="none" stroke="#a64d3e" stroke-width=".8" opacity=".7"/><text x="125" y="178" text-anchor="middle" fill="#914236" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="1.1">UNRESOLVED</text></g>
  </g>
</svg>
