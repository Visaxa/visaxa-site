<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 620" role="img" aria-labelledby="title desc">
  <title id="title">The symptom sits on the surface</title>
  <desc id="desc">One visible symptom—a side spreadsheet beside the CRM—sits above four plausible causes: an unclear process, insufficient practice, unopened configuration, and absent software capability. Dotted threads fan from the same symptom to every cause, showing that the symptom alone does not identify the diagnosis.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#2c2823" flood-opacity=".1"/>
    </filter>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf8f1"/>
      <stop offset="1" stop-color="#f2ece1"/>
    </linearGradient>
  </defs>

  <rect width="375" height="620" fill="#f1ece3"/>
  <rect x="12" y="12" width="351" height="596" rx="3" fill="url(#paper)" stroke="#d8d0c2"/>

  <text x="28" y="43" fill="#292722" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="700">The symptom sits on the surface</text>
  <text x="28" y="65" fill="#736d64" font-family="Arial, sans-serif" font-size="11" letter-spacing=".6">ONE OBSERVATION · FOUR POSSIBLE CAUSES</text>
  <line x1="28" y1="82" x2="347" y2="82" stroke="#c9c0b3"/>

  <text x="28" y="108" fill="#8b8378" font-family="Arial, sans-serif" font-size="11" letter-spacing="1">WHAT WE COULD SEE</text>

  <g filter="url(#shadow)" transform="translate(28 127) rotate(-.5)">
    <rect width="319" height="92" rx="3" fill="#fffdf8" stroke="#d7cec0"/>
    <rect width="6" height="92" fill="#9a5d45"/>
    <text x="22" y="34" fill="#292722" font-family="Georgia, serif" font-size="18">A side spreadsheet beside the CRM</text>
    <text x="22" y="59" fill="#716a61" font-family="Arial, sans-serif" font-size="13">“This is the only place the handoff makes sense.”</text>
    <text x="22" y="79" fill="#9a9388" font-family="Arial, sans-serif" font-size="11.5">A real dependency — but not yet a diagnosis</text>
  </g>

  <path d="M28 253 C110 241 265 264 347 250" fill="none" stroke="#4c4841" stroke-width="1.4"/>
  <text x="28" y="280" fill="#8b8378" font-family="Arial, sans-serif" font-size="11" letter-spacing="1">WHAT MIGHT BE UNDERNEATH</text>

  <path d="M92 220 C87 259 70 286 70 315" fill="none" stroke="#b8afa1" stroke-width="1.1" stroke-dasharray="2 4"/>
  <path d="M150 220 C153 258 155 280 155 315" fill="none" stroke="#b8afa1" stroke-width="1.1" stroke-dasharray="2 4"/>
  <path d="M224 220 C218 257 232 282 239 315" fill="none" stroke="#b8afa1" stroke-width="1.1" stroke-dasharray="2 4"/>
  <path d="M290 220 C297 260 315 286 316 315" fill="none" stroke="#9a5d45" stroke-width="1.2" stroke-dasharray="2 4"/>

  <line x1="28" y1="319" x2="347" y2="319" stroke="#d4ccbf"/>
  <circle cx="70" cy="319" r="3" fill="#797269"/>
  <circle cx="155" cy="319" r="3" fill="#797269"/>
  <circle cx="239" cy="319" r="3" fill="#797269"/>
  <circle cx="316" cy="319" r="3.5" fill="#9a5d45"/>

  <g>
    <text x="28" y="357" fill="#292722" font-family="Georgia, serif" font-size="15">Unclear process</text>
    <text x="28" y="380" fill="#716a61" font-family="Arial, sans-serif" font-size="12.5">No shared rule for</text>
    <text x="28" y="398" fill="#716a61" font-family="Arial, sans-serif" font-size="12.5">the handoff.</text>

    <text x="201" y="357" fill="#292722" font-family="Georgia, serif" font-size="15">Insufficient practice</text>
    <text x="201" y="380" fill="#716a61" font-family="Arial, sans-serif" font-size="12.5">The supported path</text>
    <text x="201" y="398" fill="#716a61" font-family="Arial, sans-serif" font-size="12.5">isn’t usable yet.</text>

    <line x1="28" y1="432" x2="347" y2="432" stroke="#ddd5c9"/>

    <text x="28" y="469" fill="#292722" font-family="Georgia, serif" font-size="15">Unopened configuration</text>
    <text x="28" y="492" fill="#716a61" font-family="Arial, sans-serif" font-size="12.5">The account does not</text>
    <text x="28" y="510" fill="#716a61" font-family="Arial, sans-serif" font-size="12.5">express the rule.</text>

    <text x="201" y="469" fill="#9a5d45" font-family="Georgia, serif" font-size="15">Absent capability</text>
    <text x="201" y="492" fill="#716a61" font-family="Arial, sans-serif" font-size="12.5">The required work cannot</text>
    <text x="201" y="510" fill="#716a61" font-family="Arial, sans-serif" font-size="12.5">be represented.</text>
  </g>

  <line x1="28" y1="546" x2="347" y2="546" stroke="#cfc6b8"/>
  <text x="28" y="574" fill="#292722" font-family="Georgia, serif" font-size="13.5" font-style="italic">The workaround tells us where to look.</text>
  <text x="28" y="593" fill="#716a61" font-family="Arial, sans-serif" font-size="11.5">It does not tell us which remedy to buy.</text>
</svg>
