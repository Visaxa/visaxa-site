<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 1090" role="img" aria-labelledby="title desc">
  <title id="title">The symptom sits on the surface</title>
  <desc id="desc">A desk note found beside the CRM introduces one visible symptom—a side spreadsheet—followed by four possible explanations: an unclear process, insufficient practice, unopened configuration, and absent software capability. The final field note explains that the observation identifies where to investigate, not which remedy to buy.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#2c2823" flood-opacity=".1"/>
    </filter>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf8f1"/>
      <stop offset="1" stop-color="#f2ece1"/>
    </linearGradient>
  </defs>

  <rect width="375" height="1090" fill="#f1ece3"/>
  <rect x="12" y="12" width="351" height="1066" rx="4" fill="url(#paper)" stroke="#d8d0c2"/>

  <text x="30" y="52" fill="#292722" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="700">
    <tspan x="30" dy="0">The symptom sits</tspan>
    <tspan x="30" dy="28">on the surface</tspan>
  </text>
  <g transform="translate(0 22)">
  <text x="30" y="80" fill="#736d64" font-family="Arial, sans-serif" font-size="15" letter-spacing=".65">
    <tspan x="30" dy="0">ONE OBSERVATION</tspan>
    <tspan x="30" dy="21">FOUR POSSIBLE CAUSES</tspan>
  </text>
  <line x1="30" y1="125" x2="345" y2="125" stroke="#c9c0b3"/>

  <g transform="translate(0 12)">
  <text x="30" y="132" fill="#817a70" font-family="Arial, sans-serif" font-size="15" letter-spacing=".8">OBSERVED</text>

  <g filter="url(#shadow)" transform="translate(27 153) rotate(-.35)">
    <rect width="318" height="166" rx="4" fill="#fffdf8" stroke="#d7cec0"/>
    <rect width="7" height="166" rx="3" fill="#9a5d45"/>
    <text x="27" y="25" fill="#8b8378" font-family="Arial, sans-serif" font-size="12.5" letter-spacing=".8">FOUND DESK NOTE</text>
    <g transform="translate(268 14)" fill="none" stroke="#9a9388" stroke-width="1.2">
      <rect width="27" height="23" rx="2"/>
      <line x1="0" y1="7" x2="27" y2="7"/>
      <circle cx="5" cy="3.5" r="1" fill="#9a5d45" stroke="none"/>
      <line x1="7" y1="12" x2="22" y2="12"/>
      <line x1="7" y1="17" x2="18" y2="17"/>
    </g>
    <text x="27" y="56" fill="#292722" font-family="Georgia, serif" font-size="20">
      <tspan x="27" dy="0">A side spreadsheet</tspan>
      <tspan x="27" dy="24">beside the CRM</tspan>
    </text>
    <text x="27" y="111" fill="#625c54" font-family="Arial, sans-serif" font-size="16">
      <tspan x="27" dy="0">“Only here does the handoff</tspan>
      <tspan x="27" dy="20">make sense.”</tspan>
    </text>
    <text x="27" y="154" fill="#8b8378" font-family="Arial, sans-serif" font-size="15">A real dependency—not a diagnosis</text>
  </g>

  <line x1="187.5" y1="319" x2="187.5" y2="345" stroke="#9f978b" stroke-width="1.2" stroke-dasharray="3 5"/>
  <circle cx="187.5" cy="354" r="3.5" fill="#9a5d45"/>
  <text x="30" y="386" fill="#817a70" font-family="Arial, sans-serif" font-size="15" letter-spacing=".8">POSSIBLE EXPLANATIONS</text>

  <g>
    <rect x="32" y="405" width="313" height="94" rx="4" fill="#fbf8f1" stroke="#d6cec1"/>
    <text x="46" y="429" fill="#8b8378" font-family="Arial, sans-serif" font-size="14">01</text>
    <text x="76" y="430" fill="#292722" font-family="Georgia, serif" font-size="19">Unclear process</text>
    <text x="76" y="458" fill="#625c54" font-family="Arial, sans-serif" font-size="16">
      <tspan x="76" dy="0">No shared rule owns</tspan>
      <tspan x="76" dy="20">the handoff.</tspan>
    </text>

    <rect x="28" y="513" width="317" height="108" rx="4" fill="#fbf8f1" stroke="#d6cec1"/>
    <text x="46" y="539" fill="#8b8378" font-family="Arial, sans-serif" font-size="14">02</text>
    <text x="76" y="540" fill="#292722" font-family="Georgia, serif" font-size="19">Insufficient practice</text>
    <text x="76" y="570" fill="#625c54" font-family="Arial, sans-serif" font-size="16">
      <tspan x="76" dy="0">The supported path breaks</tspan>
      <tspan x="76" dy="21">under real pressure.</tspan>
    </text>

    <rect x="33" y="651" width="312" height="101" rx="4" fill="#fbf8f1" stroke="#d6cec1"/>
    <text x="46" y="677" fill="#8b8378" font-family="Arial, sans-serif" font-size="14">03</text>
    <text x="76" y="678" fill="#292722" font-family="Georgia, serif" font-size="19">Unopened configuration</text>
    <text x="76" y="706" fill="#625c54" font-family="Arial, sans-serif" font-size="16">
      <tspan x="76" dy="0">The account does not reflect</tspan>
      <tspan x="76" dy="20">the agreed rule.</tspan>
    </text>

    <rect x="26" y="771" width="319" height="112" rx="4" fill="#fffaf2" stroke="#9a5d45" stroke-width="1.2"/>
    <rect x="26" y="771" width="6" height="112" rx="3" fill="#9a5d45"/>
    <text x="46" y="799" fill="#9a5d45" font-family="Arial, sans-serif" font-size="14">04</text>
    <text x="76" y="800" fill="#9a5d45" font-family="Georgia, serif" font-size="19">Absent capability</text>
    <text x="76" y="830" fill="#625c54" font-family="Arial, sans-serif" font-size="16">
      <tspan x="76" dy="0">The software cannot represent</tspan>
      <tspan x="76" dy="21">the required work.</tspan>
    </text>
  </g>

  <line x1="30" y1="920" x2="30" y2="1011" stroke="#9a5d45" stroke-width="2"/>
  <text x="50" y="934" fill="#9a5d45" font-family="Arial, sans-serif" font-size="13.5" letter-spacing=".8">FIELD NOTE</text>
  <text x="50" y="966" fill="#292722" font-family="Georgia, serif" font-size="18" font-style="italic">
    <tspan x="50" dy="0">The workaround tells us</tspan>
    <tspan x="50" dy="23">where to look—not which</tspan>
    <tspan x="50" dy="23">remedy to buy.</tspan>
  </text>
  </g>
  </g>
</svg>
