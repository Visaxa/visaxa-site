<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 1440" role="img" aria-labelledby="title desc">
  <title id="title">After the conditions changed</title>
  <desc id="desc">An editorial field notebook records one salon handoff after the rule was clarified, staff practised it, configuration was checked, and the task was repeated. Spacious stacked result cards show friction fading while a software limitation remains.</desc>
  <defs>
    <filter id="pageShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#2d2923" flood-opacity=".1"/>
    </filter>
    <pattern id="rules" width="8" height="29" patternUnits="userSpaceOnUse">
      <line x1="0" y1="28.5" x2="8" y2="28.5" stroke="#ded7cc" stroke-width=".8"/>
    </pattern>
  </defs>

  <rect width="375" height="1440" fill="#eee9df"/>
  <rect x="12" y="12" width="351" height="1416" rx="4" fill="#f8f4ec" stroke="#d4cbbd"/>

  <text x="30" y="52" fill="#292722" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="700">
    <tspan x="30" dy="0">After the conditions</tspan>
    <tspan x="30" dy="28">changed</tspan>
  </text>
  <g transform="translate(0 40)">
  <text x="30" y="80" fill="#6f685f" font-family="Arial, sans-serif" font-size="15" letter-spacing=".6">
    <tspan x="30" dy="0">FIELD NOTES FROM ONE</tspan>
    <tspan x="30" dy="21">REPEATED HANDOFF</tspan>
  </text>
  <line x1="30" y1="125" x2="345" y2="125" stroke="#c9c0b3"/>

  <g transform="translate(0 26)">
  <g filter="url(#pageShadow)">
    <rect x="30" y="126" width="315" height="710" rx="4" fill="#fffdf8" stroke="#d5ccbe"/>
  </g>
  <rect x="30" y="126" width="315" height="710" rx="4" fill="url(#rules)" opacity=".42"/>
  <line x1="62" y1="126" x2="62" y2="836" stroke="#c98c76"/>

  <text x="47" y="176" fill="#9a5d45" font-family="Arial, sans-serif" font-size="14.5" letter-spacing=".7" transform="rotate(-90 47 176)">ONE TASK</text>
  <text x="80" y="163" fill="#292722" font-family="Georgia, serif" font-size="20">Client handoff</text>
  <text x="80" y="190" fill="#625c54" font-family="Arial, sans-serif" font-size="16">Ordinary week. One exception.</text>
  <text x="80" y="217" fill="#7b746b" font-family="Arial, sans-serif" font-size="15">
    <tspan x="80" dy="0">Outcome: exception</tspan>
    <tspan x="80" dy="20">arrives in time.</tspan>
  </text>

  <line x1="80" y1="263" x2="317" y2="263" stroke="#d5ccbe"/>

  <g>
    <text x="40" y="300" fill="#8b8378" font-family="Arial, sans-serif" font-size="14">01</text>
    <text x="80" y="294" fill="#292722" font-family="Georgia, serif" font-size="19">The rule became explicit</text>
    <text x="80" y="324" fill="#625c54" font-family="Arial, sans-serif" font-size="16">
      <tspan x="80" dy="0">Owner and handoff named.</tspan>
      <tspan x="80" dy="21">Ordinary case. Exception.</tspan>
    </text>

    <text x="40" y="428" fill="#8b8378" font-family="Arial, sans-serif" font-size="14">02</text>
    <text x="80" y="422" fill="#292722" font-family="Georgia, serif" font-size="19">Staff practised the task</text>
    <text x="80" y="452" fill="#625c54" font-family="Arial, sans-serif" font-size="16">
      <tspan x="80" dy="0">Right role, real device,</tspan>
      <tspan x="80" dy="21">time pressure, exception.</tspan>
    </text>

    <text x="40" y="583" fill="#8b8378" font-family="Arial, sans-serif" font-size="14">03</text>
    <text x="80" y="577" fill="#292722" font-family="Georgia, serif" font-size="19">Configuration check</text>
    <text x="80" y="607" fill="#625c54" font-family="Arial, sans-serif" font-size="16">
      <tspan x="80" dy="0">Documentation compared</tspan>
      <tspan x="80" dy="21">with the live account.</tspan>
    </text>

    <text x="40" y="712" fill="#9a5d45" font-family="Arial, sans-serif" font-size="14">04</text>
    <text x="80" y="706" fill="#292722" font-family="Georgia, serif" font-size="19">The handoff was repeated</text>
    <text x="80" y="736" fill="#625c54" font-family="Arial, sans-serif" font-size="16">
      <tspan x="80" dy="0">Normal variation first.</tspan>
      <tspan x="80" dy="21">Then the exception.</tspan>
    </text>
  </g>

  <path d="M80 804 C151 788 228 816 317 798" fill="none" stroke="#aaa297" stroke-width="1.1"/>
  <circle cx="80" cy="804" r="2.5" fill="#777168"/>
  <circle cx="317" cy="798" r="2.7" fill="#9a5d45"/>

  <text x="30" y="882" fill="#292722" font-family="Georgia, serif" font-size="18.5">
    <tspan x="30" dy="0">What changed</tspan>
    <tspan x="30" dy="25">and what did not</tspan>
  </text>

  <g>
    <rect x="30" y="932" width="315" height="124" rx="4" fill="#e9e4da" stroke="#cec5b8"/>
    <text x="50" y="962" fill="#777168" font-family="Arial, sans-serif" font-size="15" letter-spacing=".5">FRICTION THAT FADED</text>
    <text x="50" y="995" fill="#292722" font-family="Georgia, serif" font-size="20">Duplicate notes</text>
    <text x="50" y="1023" fill="#625c54" font-family="Arial, sans-serif" font-size="16">
      <tspan x="50" dy="0">A shared rule removed</tspan>
      <tspan x="50" dy="21">the private record.</tspan>
    </text>
  </g>

  <g>
    <rect x="30" y="1090" width="315" height="174" rx="4" fill="#fffaf2" stroke="#9a5d45" stroke-width="1.2"/>
    <rect x="30" y="1090" width="6" height="174" rx="3" fill="#9a5d45"/>
    <text x="50" y="1123" fill="#9a5d45" font-family="Arial, sans-serif" font-size="15" letter-spacing=".5">LIMIT THAT REMAINED</text>
    <text x="50" y="1162" fill="#292722" font-family="Georgia, serif" font-size="22">Exception not visible</text>
    <text x="50" y="1195" fill="#625c54" font-family="Arial, sans-serif" font-size="17">
      <tspan x="50" dy="0">The supported path still could not</tspan>
      <tspan x="50" dy="23">carry the exception.</tspan>
    </text>
    <text x="50" y="1240" fill="#9a5d45" font-family="Arial, sans-serif" font-size="13.5" letter-spacing=".7">BOUNDARY AFTER THE TEST</text>
  </g>

  <text x="30" y="1320" fill="#625c54" font-family="Georgia, serif" font-size="16" font-style="italic">The remaining boundary is now visible.</text>
  </g>
  </g>
</svg>
