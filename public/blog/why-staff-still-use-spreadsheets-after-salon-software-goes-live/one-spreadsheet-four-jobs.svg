<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" role="img" aria-labelledby="title desc">
  <title id="title">One spreadsheet, four possible jobs</title>
  <desc id="desc">An editorial desk composition places one working spreadsheet at the centre and four large notes around it: carries knowledge, buys time, shifts burden, and bypasses control.</desc>
  <rect width="760" height="600" fill="#f4efe7"/>
  <text x="44" y="52" fill="#2a2927" font-family="Georgia,serif" font-size="30" font-weight="700">One spreadsheet, four possible jobs</text>
  <text x="44" y="84" fill="#68615a" font-family="Arial,sans-serif" font-size="20">The object is obvious. Its purpose is not.</text>
  <g transform="translate(246 142) rotate(-1.2 134 150)">
    <rect x="7" y="9" width="278" height="309" rx="5" fill="#cfc5b8" opacity=".48"/>
    <rect width="278" height="309" rx="5" fill="#fffdf9" stroke="#b8aea1" stroke-width="1.5"/>
    <text x="24" y="40" fill="#2a2927" font-family="Georgia,serif" font-size="23" font-weight="700">Tuesday handoff</text>
    <line x1="24" y1="57" x2="254" y2="57" stroke="#2a2927" stroke-width="1.5"/>
    <text x="24" y="86" fill="#776f67" font-family="Arial,sans-serif" font-size="16" letter-spacing="1">CLIENT</text>
    <text x="130" y="86" fill="#776f67" font-family="Arial,sans-serif" font-size="16" letter-spacing="1">NEED</text>
    <g fill="#2a2927" font-family="Arial,sans-serif" font-size="20">
      <text x="24" y="124">Mara</text><text x="130" y="124">handoff</text>
      <text x="24" y="172">Jon</text><text x="130" y="172">confirm</text>
      <text x="24" y="220">Elena</text><text x="130" y="220">timing</text>
    </g>
    <g stroke="#ded6cc" stroke-width="1.5"><line x1="24" y1="139" x2="254" y2="139"/><line x1="24" y1="187" x2="254" y2="187"/><line x1="24" y1="235" x2="254" y2="235"/></g>
    <rect x="23" y="255" width="232" height="36" fill="#eee7dc"/>
    <text x="35" y="280" fill="#9a4f3f" font-family="Arial,sans-serif" font-size="18" font-weight="700">Which record changed?</text>
  </g>
  <g font-family="Arial,sans-serif">
    <g transform="translate(44 136) rotate(-2)">
      <rect width="183" height="118" rx="3" fill="#fffaf2" stroke="#d7cdc0"/>
      <text x="16" y="34" fill="#9a4f3f" font-size="21" font-weight="700">Carries knowledge</text>
      <text x="16" y="70" fill="#2a2927" font-size="21">Keeps a handoff</text>
      <text x="16" y="98" fill="#2a2927" font-size="21">from disappearing.</text>
    </g>
    <g transform="translate(536 142) rotate(1.5)">
      <rect width="180" height="112" rx="3" fill="#fffaf2" stroke="#d7cdc0"/>
      <text x="16" y="34" fill="#9a4f3f" font-size="21" font-weight="700">Buys time</text>
      <text x="16" y="70" fill="#2a2927" font-size="21">Makes busy work</text>
      <text x="16" y="98" fill="#2a2927" font-size="21">faster to scan.</text>
    </g>
    <g transform="translate(43 340) rotate(1.2)">
      <rect width="186" height="116" rx="3" fill="#fffaf2" stroke="#d7cdc0"/>
      <text x="16" y="34" fill="#9a4f3f" font-size="21" font-weight="700">Shifts burden</text>
      <text x="16" y="70" fill="#2a2927" font-size="21">Names who carries</text>
      <text x="16" y="98" fill="#2a2927" font-size="21">unclear work.</text>
    </g>
    <g transform="translate(532 342) rotate(-1.4)">
      <rect width="185" height="118" rx="3" fill="#efe1d8" stroke="#c89585"/>
      <text x="16" y="34" fill="#8d4436" font-size="21" font-weight="700">Bypasses control</text>
      <text x="16" y="65" fill="#2a2927" font-size="19">Work finishes.</text>
      <text x="16" y="88" fill="#2a2927" font-size="19">The shared record</text>
      <text x="16" y="111" fill="#2a2927" font-size="19">stays stale.</text>
    </g>
  </g>
  <line x1="44" y1="510" x2="716" y2="510" stroke="#c9bfb3" stroke-width="1.5"/>
  <text x="44" y="550" fill="#2a2927" font-family="Georgia,serif" font-size="23" font-style="italic">Useful to one person can still be costly</text>
  <text x="44" y="580" fill="#2a2927" font-family="Georgia,serif" font-size="23" font-style="italic">to the shared operation.</text>
</svg>
