<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 560" role="img" aria-labelledby="title desc">
  <title id="title">Honest requirements turn a crowded field into a meaningful shortlist</title>
  <desc id="desc">Twelve fictional candidate cards lie on a research desk. Cards failing operating fit, evidence, exit, and real-cost requirements are crossed out, leaving two clear shortlist cards.</desc>
  <rect width="750" height="560" fill="#f3eee5"/>
  <text x="42" y="46" fill="#934f42" font-family="Arial,sans-serif" font-size="13" letter-spacing="2.3">ON THE OWNER’S DESK</text>
  <text x="42" y="88" fill="#201f1c" font-family="Georgia,serif" font-size="32">Twelve names entered.</text>
  <text x="42" y="124" fill="#201f1c" font-family="Georgia,serif" font-size="32">Only two requirements-led choices remained.</text>

  <g transform="translate(40 161)">
    <rect width="470" height="334" rx="4" fill="#e9e1d5" stroke="#d0c5b6"/>
    <text x="20" y="29" fill="#6c655d" font-family="Arial,sans-serif" font-size="16" letter-spacing="1.5">12 CANDIDATES</text>
    <g font-family="Georgia,serif" font-size="20" text-anchor="middle">
      <g transform="translate(20 51) rotate(-2 47 38)"><rect width="94" height="76" fill="#fffdfa" stroke="#c9bfb2"/><text x="47" y="46" fill="#77706a">A</text><path d="M14 15 L80 61 M80 15 L14 61" stroke="#a45a4c" stroke-width="3"/></g>
      <g transform="translate(131 48) rotate(1.5 47 38)"><rect width="94" height="76" fill="#fffdfa" stroke="#c9bfb2"/><text x="47" y="46" fill="#77706a">B</text><path d="M14 15 L80 61 M80 15 L14 61" stroke="#a45a4c" stroke-width="3"/></g>
      <g transform="translate(242 53) rotate(-1 47 38)"><rect width="94" height="76" fill="#fffdfa" stroke="#c9bfb2"/><text x="47" y="46" fill="#77706a">C</text><path d="M14 15 L80 61 M80 15 L14 61" stroke="#a45a4c" stroke-width="3"/></g>
      <g transform="translate(353 49) rotate(2 47 38)"><rect width="94" height="76" fill="#fffdfa" stroke="#c9bfb2"/><text x="47" y="46" fill="#77706a">D</text><path d="M14 15 L80 61 M80 15 L14 61" stroke="#a45a4c" stroke-width="3"/></g>
      <g transform="translate(21 145) rotate(1 47 38)"><rect width="94" height="76" fill="#fffdfa" stroke="#c9bfb2"/><text x="47" y="46" fill="#77706a">E</text><path d="M14 15 L80 61 M80 15 L14 61" stroke="#a45a4c" stroke-width="3"/></g>
      <g transform="translate(132 141) rotate(-1.7 47 38)"><rect width="94" height="76" fill="#fffdfa" stroke="#c9bfb2"/><text x="47" y="46" fill="#77706a">F</text><path d="M14 15 L80 61 M80 15 L14 61" stroke="#a45a4c" stroke-width="3"/></g>
      <g transform="translate(243 146) rotate(1.2 47 38)"><rect width="94" height="76" fill="#fffdfa" stroke="#c9bfb2"/><text x="47" y="46" fill="#77706a">G</text><path d="M14 15 L80 61 M80 15 L14 61" stroke="#a45a4c" stroke-width="3"/></g>
      <g transform="translate(354 142) rotate(-1 47 38)"><rect width="94" height="76" fill="#fffdfa" stroke="#c9bfb2"/><text x="47" y="46" fill="#77706a">H</text><path d="M14 15 L80 61 M80 15 L14 61" stroke="#a45a4c" stroke-width="3"/></g>
      <g transform="translate(20 239) rotate(-1.2 47 38)"><rect width="94" height="76" fill="#fffdfa" stroke="#c9bfb2"/><text x="47" y="46" fill="#77706a">I</text><path d="M14 15 L80 61 M80 15 L14 61" stroke="#a45a4c" stroke-width="3"/></g>
      <g transform="translate(131 236) rotate(2 47 38)"><rect width="94" height="76" fill="#fffdfa" stroke="#c9bfb2"/><text x="47" y="46" fill="#77706a">J</text><path d="M14 15 L80 61 M80 15 L14 61" stroke="#a45a4c" stroke-width="3"/></g>
      <g transform="translate(242 240) rotate(-1 47 38)"><rect width="94" height="76" fill="#fffdfa" stroke="#c9bfb2"/><text x="47" y="46" fill="#77706a">K</text><path d="M14 15 L80 61 M80 15 L14 61" stroke="#a45a4c" stroke-width="3"/></g>
      <g transform="translate(353 237) rotate(1.4 47 38)"><rect width="94" height="76" fill="#fffdfa" stroke="#c9bfb2"/><text x="47" y="46" fill="#77706a">L</text><path d="M14 15 L80 61 M80 15 L14 61" stroke="#a45a4c" stroke-width="3"/></g>
    </g>
    <g fill="#934f42" font-family="Arial,sans-serif" font-size="15" letter-spacing=".8">
      <text x="23" y="140">OPERATING FIT</text>
      <text x="244" y="140">EVIDENCE</text>
      <text x="23" y="234">SAFE EXIT</text>
      <text x="244" y="234">REAL COST</text>
    </g>
  </g>

  <g transform="translate(548 171) rotate(1 81 151)">
    <rect width="162" height="302" rx="4" fill="#fffdfa" stroke="#9f9182" stroke-width="1.5"/>
    <text x="81" y="34" text-anchor="middle" fill="#934f42" font-family="Arial,sans-serif" font-size="16" letter-spacing="1.5">SHORTLIST</text>
    <line x1="24" y1="50" x2="138" y2="50" stroke="#d8d0c5"/>
    <rect x="27" y="78" width="108" height="72" rx="2" fill="#934f42"/>
    <text x="81" y="123" text-anchor="middle" fill="#fffdfa" font-family="Georgia,serif" font-size="27">M</text>
    <rect x="27" y="172" width="108" height="72" rx="2" fill="#5e716b"/>
    <text x="81" y="217" text-anchor="middle" fill="#fffdfa" font-family="Georgia,serif" font-size="27">N</text>
    <text x="81" y="270" text-anchor="middle" fill="#282622" font-family="Georgia,serif" font-size="17">Both pass every</text>
    <text x="81" y="292" text-anchor="middle" fill="#282622" font-family="Georgia,serif" font-size="17">non-negotiable.</text>
  </g>

  <line x1="42" y1="522" x2="708" y2="522" stroke="#c9bfb2"/>
  <text x="375" y="547" text-anchor="middle" fill="#201f1c" font-family="Georgia,serif" font-size="17">Comparison begins after the requirements have done their work.</text>
</svg>
