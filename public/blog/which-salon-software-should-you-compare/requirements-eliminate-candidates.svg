<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 690" role="img" aria-labelledby="title desc">
  <title id="title">The comparison field changes after every requirement</title>
  <desc id="desc">A field of twelve candidate marks becomes seven, then four, then two as non-negotiable requirements are applied, showing that comparison begins after requirements eliminate unsuitable candidates.</desc>
  <rect width="375" height="690" fill="#f5f0e7"/>
  <text x="28" y="46" fill="#8d4b3f" font-family="Arial,sans-serif" font-size="12" letter-spacing="1.7">THE VANISHING FIELD</text>
  <text x="28" y="82" fill="#201f1c" font-family="Georgia,serif" font-size="24">Every honest requirement</text>
  <text x="28" y="111" fill="#201f1c" font-family="Georgia,serif" font-size="24">makes the list smaller.</text>
  <g font-family="Arial,sans-serif">
    <text x="28" y="164" fill="#686159" font-size="11" letter-spacing="1.2">TWELVE NAMES</text>
    <g fill="#d4ccc0">
      <circle cx="42" cy="194" r="9"/><circle cx="72" cy="194" r="9"/><circle cx="102" cy="194" r="9"/><circle cx="132" cy="194" r="9"/><circle cx="162" cy="194" r="9"/><circle cx="192" cy="194" r="9"/><circle cx="222" cy="194" r="9"/><circle cx="252" cy="194" r="9"/><circle cx="282" cy="194" r="9"/><circle cx="312" cy="194" r="9"/><circle cx="42" cy="224" r="9"/><circle cx="72" cy="224" r="9"/>
    </g>
    <text x="28" y="276" fill="#8d4b3f" font-size="11" letter-spacing="1.2">AFTER OPERATING FIT</text>
    <g fill="#b9afa2"><circle cx="42" cy="307" r="10"/><circle cx="78" cy="307" r="10"/><circle cx="114" cy="307" r="10"/><circle cx="150" cy="307" r="10"/><circle cx="186" cy="307" r="10"/><circle cx="222" cy="307" r="10"/><circle cx="258" cy="307" r="10"/></g>
    <text x="28" y="366" fill="#8d4b3f" font-size="11" letter-spacing="1.2">AFTER EVIDENCE AND EXIT</text>
    <g fill="#8d8175"><circle cx="42" cy="398" r="11"/><circle cx="84" cy="398" r="11"/><circle cx="126" cy="398" r="11"/><circle cx="168" cy="398" r="11"/></g>
    <text x="28" y="462" fill="#8d4b3f" font-size="11" letter-spacing="1.2">AFTER THE REAL COST CASE</text>
    <circle cx="43" cy="501" r="13" fill="#8d4b3f"/><circle cx="94" cy="501" r="13" fill="#8d4b3f"/>
  </g>
  <line x1="28" y1="558" x2="347" y2="558" stroke="#c9c0b2"/>
  <line x1="28" y1="588" x2="28" y2="654" stroke="#8d4b3f" stroke-width="3"/>
  <text x="48" y="600" fill="#201f1c" font-family="Georgia,serif" font-size="18">Now there is something</text>
  <text x="48" y="624" fill="#201f1c" font-family="Georgia,serif" font-size="18">worth comparing.</text>
  <text x="48" y="650" fill="#686159" font-family="Arial,sans-serif" font-size="12">Preferences decide only among survivors.</text>
</svg>
