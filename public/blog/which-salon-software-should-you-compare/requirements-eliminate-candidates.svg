<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 500" role="img" aria-labelledby="title desc">
  <title id="title">Requirements progressively reduce a crowded CRM field to a meaningful shortlist</title>
  <desc id="desc">A salon owner’s research desk moves visually from a thick stack of twelve fictional CRM cards, through three discarded piles marked operating fit, evidence, and exit plus cost, to a final shortlist of two candidates.</desc>
  <rect width="750" height="500" fill="#f2ede4"/>
  <text x="58" y="42" fill="#965244" font-family="Arial,sans-serif" font-size="13" letter-spacing="2.2">THE SHORTLIST DID NOT BEGIN SHORT</text>
  <text x="58" y="82" fill="#201f1c" font-family="Georgia,serif" font-size="30">Requirements removed the noise.</text>
  <text x="58" y="116" fill="#6b645c" font-family="Arial,sans-serif" font-size="15">A working desk, from first look to defensible choice.</text>

  <g transform="translate(39 170) rotate(-1.5 86 116)">
    <rect x="10" y="14" width="172" height="224" rx="3" fill="#d8cfc3" stroke="#bfb3a5"/>
    <rect x="5" y="7" width="172" height="224" rx="3" fill="#e7ded2" stroke="#c5b9ab"/>
    <rect width="172" height="224" rx="3" fill="#fffdfa" stroke="#b9ad9f"/>
    <text x="18" y="29" fill="#965244" font-family="Arial,sans-serif" font-size="12" letter-spacing="1.5">FIRST LOOK</text>
    <text x="18" y="67" fill="#201f1c" font-family="Georgia,serif" font-size="31">12</text>
    <text x="63" y="66" fill="#201f1c" font-family="Georgia,serif" font-size="19">CRM names</text>
    <g fill="#d8d0c5">
      <rect x="18" y="92" width="39" height="28" rx="2"/><rect x="66" y="92" width="39" height="28" rx="2"/><rect x="114" y="92" width="39" height="28" rx="2"/>
      <rect x="18" y="129" width="39" height="28" rx="2"/><rect x="66" y="129" width="39" height="28" rx="2"/><rect x="114" y="129" width="39" height="28" rx="2"/>
      <rect x="18" y="166" width="39" height="28" rx="2"/><rect x="66" y="166" width="39" height="28" rx="2"/><rect x="114" y="166" width="39" height="28" rx="2"/>
    </g>
    <text x="18" y="214" fill="#6b645c" font-family="Arial,sans-serif" font-size="12">Nothing tested yet.</text>
  </g>

  <g transform="translate(226 160)">
    <text x="0" y="16" fill="#6b645c" font-family="Arial,sans-serif" font-size="11" letter-spacing="1.3">THE DESK FILLS WITH REASONS</text>
    <g transform="translate(6 40) rotate(-3 68 42)">
      <rect width="136" height="84" rx="2" fill="#fffdfa" stroke="#c7bbad"/>
      <text x="14" y="27" fill="#965244" font-family="Arial,sans-serif" font-size="12" letter-spacing="1.1">SET ASIDE</text>
      <text x="14" y="57" fill="#201f1c" font-family="Georgia,serif" font-size="18">Operating fit</text>
      <path d="M105 16 l17 17 M122 16 l-17 17" stroke="#965244" stroke-width="2.5"/>
    </g>
    <g transform="translate(22 133) rotate(2 68 42)">
      <rect width="136" height="84" rx="2" fill="#faf6ef" stroke="#c7bbad"/>
      <text x="14" y="27" fill="#965244" font-family="Arial,sans-serif" font-size="12" letter-spacing="1.1">SET ASIDE</text>
      <text x="14" y="57" fill="#201f1c" font-family="Georgia,serif" font-size="18">Evidence</text>
      <path d="M105 16 l17 17 M122 16 l-17 17" stroke="#965244" stroke-width="2.5"/>
    </g>
    <g transform="translate(4 214) rotate(-1.5 68 42)">
      <rect width="136" height="84" rx="2" fill="#fffdfa" stroke="#c7bbad"/>
      <text x="14" y="27" fill="#965244" font-family="Arial,sans-serif" font-size="12" letter-spacing="1.1">SET ASIDE</text>
      <text x="14" y="55" fill="#201f1c" font-family="Georgia,serif" font-size="17">Exit + real cost</text>
      <path d="M105 16 l17 17 M122 16 l-17 17" stroke="#965244" stroke-width="2.5"/>
    </g>
  </g>

  <path d="M407 185 C445 202 435 351 478 372" fill="none" stroke="#c5b9ab" stroke-width="2" stroke-dasharray="2 8"/>
  <text x="429" y="267" fill="#965244" font-family="Georgia,serif" font-size="16" transform="rotate(7 429 267)">requirement</text>
  <text x="439" y="287" fill="#965244" font-family="Georgia,serif" font-size="16" transform="rotate(7 439 287)">by requirement</text>

  <g transform="translate(505 151) rotate(1 98 143)">
    <rect width="196" height="286" rx="3" fill="#fffdfa" stroke="#9d9081" stroke-width="1.5"/>
    <path d="M54 -5 v19 M142 -5 v19" stroke="#7f7a74" stroke-width="3"/>
    <text x="98" y="37" text-anchor="middle" fill="#965244" font-family="Arial,sans-serif" font-size="13" letter-spacing="1.7">SHORTLIST</text>
    <line x1="24" y1="54" x2="172" y2="54" stroke="#d9d1c7"/>
    <g transform="translate(25 75) rotate(-1)">
      <rect width="146" height="69" rx="2" fill="#965244"/>
      <text x="73" y="43" text-anchor="middle" fill="#fffdfa" font-family="Georgia,serif" font-size="23">Cedar</text>
    </g>
    <g transform="translate(25 158) rotate(1.5)">
      <rect width="146" height="69" rx="2" fill="#60736d"/>
      <text x="73" y="43" text-anchor="middle" fill="#fffdfa" font-family="Georgia,serif" font-size="23">North</text>
    </g>
    <text x="98" y="251" text-anchor="middle" fill="#201f1c" font-family="Georgia,serif" font-size="16">Only candidates that</text>
    <text x="98" y="272" text-anchor="middle" fill="#201f1c" font-family="Georgia,serif" font-size="16">still pass belong here.</text>
  </g>

  <line x1="38" y1="466" x2="712" y2="466" stroke="#c8bdaf"/>
  <text x="375" y="488" text-anchor="middle" fill="#201f1c" font-family="Georgia,serif" font-size="17">Comparison starts after the requirements have narrowed the field.</text>
</svg>
